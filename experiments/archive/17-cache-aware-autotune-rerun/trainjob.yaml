apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: qwen3-8-27b-cache-aware-retune-exp17
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  runtimeRef:
    name: torch-distributed-cuda130-torch210-py312
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
  trainer:
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0-1786533823
    numNodes: 1
    numProcPerNode: 1
    resourcesPerNode:
      requests:
        cpu: "2"
        memory: 16Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "6"
        memory: 28Gi
        nvidia.com/gpu: "1"
    command:
      - /bin/bash
      - -lc
    args:
      - |
        set -euo pipefail

        cat > /tmp/cache_aware_tune.py <<'SCRIPT_EOF'
        # SPDX-License-Identifier: Apache-2.0
        # SPDX-FileCopyrightText: Copyright contributors to the vLLM project
        #
        # Experiment 17: cache-aware rerun of vLLM's real W8A8 block-FP8
        # autotuning search. Adapted from benchmarks/kernels/benchmark_w8a8_block_fp8.py
        # (same script the production qwen3-8-27b-fp8-dense-autotune TrainJob runs) --
        # verbatim except tune()'s weight-tensor handling, see the docstring below.

        import json
        import re
        import time
        from functools import cache
        from typing import Any

        import torch
        from tqdm import tqdm

        from vllm.model_executor.layers.quantization.utils.fp8_utils import (
            _w8a8_triton_block_scaled_mm,
        )
        from vllm.platforms import current_platform
        from vllm.triton_utils import triton

        assert current_platform.is_cuda() or current_platform.is_rocm()


        @cache
        def get_device_name_as_file_name(device_id: int = 0) -> str:
            name = current_platform.get_device_name(device_id)
            return re.sub(r"[\s/]+", "_", name)


        def w8a8_block_matmul(A, B, As, Bs, block_size, config, output_dtype=torch.float16):
            block_n, block_k = block_size[0], block_size[1]
            assert A.shape[-1] == B.shape[-1]
            M = A.numel() // A.shape[-1]
            N, K = B.shape
            C_shape = A.shape[:-1] + (N,)
            C = A.new_empty(C_shape, dtype=output_dtype)

            def grid(META):
                return (
                    triton.cdiv(M, META["BLOCK_SIZE_M"]) * triton.cdiv(N, META["BLOCK_SIZE_N"]),
                )

            kernel = _w8a8_triton_block_scaled_mm
            kernel[grid](
                A, B, C, As, Bs, M, N, K, block_n, block_k,
                A.stride(-2), A.stride(-1),
                B.stride(1), B.stride(0),
                C.stride(-2), C.stride(-1),
                As.stride(-2), As.stride(-1),
                Bs.stride(1), Bs.stride(0),
                **config,
            )
            return C


        def get_configs_compute_bound():
            # copied verbatim from benchmarks/kernels/benchmark_w8a8_block_fp8.py
            configs = []
            for num_stages in [2, 3, 4, 5]:
                for block_m in [16, 32, 64, 128, 256]:
                    for block_k in [64, 128]:
                        for block_n in [32, 64, 128, 256]:
                            for num_warps in [4, 8]:
                                for group_size in [1, 16, 32, 64]:
                                    configs.append({
                                        "BLOCK_SIZE_M": block_m,
                                        "BLOCK_SIZE_N": block_n,
                                        "BLOCK_SIZE_K": block_k,
                                        "GROUP_SIZE_M": group_size,
                                        "num_warps": num_warps,
                                        "num_stages": num_stages,
                                    })
            return configs


        N_WEIGHT_COPIES = 64  # matches the real model's layer count, matches exp 12's design


        def make_A(m, k, block_k):
            fp8_info = torch.finfo(torch.float8_e4m3fn)
            fp8_max, fp8_min = fp8_info.max, fp8_info.min
            A_fp32 = (torch.rand(m, k, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
            A = A_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
            k_tiles = (k + block_k - 1) // block_k
            As = torch.rand(m, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
            return A, As


        def make_B(n, k, block_n, block_k):
            fp8_info = torch.finfo(torch.float8_e4m3fn)
            fp8_max, fp8_min = fp8_info.max, fp8_info.min
            n_tiles = (n + block_n - 1) // block_n
            k_tiles = (k + block_k - 1) // block_k
            B_fp32 = (torch.rand(n, k, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
            B = B_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
            Bs = torch.rand(n_tiles, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
            return B, Bs


        class CyclingLaunchCounter:
            """Global, NEVER reset-per-candidate-config counter. Exp 12's own ncu
            follow-up found a single isolated cache miss costs nothing for either
            config -- only continuous, sustained cycling through many distinct
            tensors does. Resetting per-candidate would just reproduce the
            single-miss pattern; a global counter keeps the cache under
            continuous pressure for the whole search, matching 12's design."""

            def __init__(self, copies):
                self.copies = copies
                self.i = 0

            def next(self):
                B, Bs = self.copies[self.i % len(self.copies)]
                self.i += 1
                return B, Bs


        def benchmark_config_cycling(A, As, counter, block_size, config, out_dtype, num_iters=10):
            def run():
                B, Bs = counter.next()
                w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

            torch.accelerator.synchronize()
            for _ in range(5):
                run()
            torch.accelerator.synchronize()

            start_event = torch.Event(enable_timing=True)
            end_event = torch.Event(enable_timing=True)
            latencies = []
            for _ in range(num_iters):
                torch.accelerator.synchronize()
                start_event.record()
                run()
                end_event.record()
                end_event.synchronize()
                latencies.append(start_event.elapsed_time(end_event))
            # /10 matches the real script's own documented timing bug -- kept
            # for exact methodology parity; a constant factor, cancels in ranking.
            avg = sum(latencies) / (num_iters * 10) * 1000  # us
            return avg


        def tune_cache_aware(M, N, K, block_size, out_dtype, search_space):
            block_n, block_k = block_size[0], block_size[1]
            A, As = make_A(M, K, block_k)
            print(f"  allocating {N_WEIGHT_COPIES} distinct B copies "
                  f"({N_WEIGHT_COPIES * N * K / 1e9:.2f}GB total)...", flush=True)
            copies = [make_B(N, K, block_n, block_k) for _ in range(N_WEIGHT_COPIES)]
            torch.accelerator.synchronize()
            counter = CyclingLaunchCounter(copies)

            best_config, best_time = None, float("inf")
            n_ok, n_skipped = 0, 0
            for config in tqdm(search_space):
                try:
                    kernel_time = benchmark_config_cycling(
                        A, As, counter, block_size, config, out_dtype, num_iters=10
                    )
                except triton.runtime.autotuner.OutOfResources:
                    n_skipped += 1
                    continue
                n_ok += 1
                if kernel_time < best_time:
                    best_time, best_config = kernel_time, config
            assert best_config is not None
            print(f"  {n_ok} configs evaluated, {n_skipped} skipped (OutOfResources), "
                  f"{counter.i} total kernel launches", flush=True)
            return best_config, best_time


        if __name__ == "__main__":
            torch.cuda.init()
            N, K = 17408, 5120  # gate_up_proj
            BLOCK_N, BLOCK_K = 128, 128
            OUT_DTYPE = torch.bfloat16
            M_VALUES = [1024, 2048]

            # original always-warm tuner's real output for this shape, for comparison
            # (from tuned-configs/N=17408,K=5120,...json in the project repo)
            ORIGINAL = {
                1024: {"BLOCK_SIZE_M": 128, "BLOCK_SIZE_N": 128, "BLOCK_SIZE_K": 128,
                       "GROUP_SIZE_M": 1, "num_warps": 8, "num_stages": 4},
                2048: {"BLOCK_SIZE_M": 128, "BLOCK_SIZE_N": 128, "BLOCK_SIZE_K": 128,
                       "GROUP_SIZE_M": 1, "num_warps": 8, "num_stages": 3},
            }

            search_space = get_configs_compute_bound()
            print(f"device: {get_device_name_as_file_name()}", flush=True)
            print(f"search space size: {len(search_space)}", flush=True)

            results = {}
            t0 = time.time()
            for M in M_VALUES:
                print(f"\n=== tuning M={M} (cache-aware, {N_WEIGHT_COPIES}-copy cycling) ===",
                      flush=True)
                tm0 = time.time()
                best_config, best_time = tune_cache_aware(
                    M, N, K, [BLOCK_N, BLOCK_K], OUT_DTYPE, search_space
                )
                print(f"  took {time.time() - tm0:.1f}s", flush=True)
                results[M] = {
                    "cache_aware_best_config": best_config,
                    "cache_aware_best_time_us_buggy_div10": best_time,
                    "original_always_warm_config": ORIGINAL[M],
                }
                same_group = best_config["GROUP_SIZE_M"] == ORIGINAL[M]["GROUP_SIZE_M"]
                print(f"M={M}:", flush=True)
                print(f"  cache-aware winner   : {best_config}  (avg={best_time:.2f}us)",
                      flush=True)
                print(f"  original always-warm : {ORIGINAL[M]}", flush=True)
                print(f"  GROUP_SIZE_M {'MATCHES' if same_group else 'DIFFERS'} "
                      f"({best_config['GROUP_SIZE_M']} vs {ORIGINAL[M]['GROUP_SIZE_M']})",
                      flush=True)

            print(f"\ntotal time: {time.time() - t0:.1f}s", flush=True)
            print("\n=== RESULTS_JSON_BEGIN ===")
            print(json.dumps(results, indent=2, default=str))
            print("=== RESULTS_JSON_END ===")
        SCRIPT_EOF

        python3 /tmp/cache_aware_tune.py
