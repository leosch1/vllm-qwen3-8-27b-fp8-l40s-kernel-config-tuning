apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: qwen3-8-27b-cache-aware-m2048-stability
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  runtimeRef:
    name: torch-distributed-cuda130-torch210-py312
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
  trainer:
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0-1786533823
    numNodes: 1
    numProcPerNode: 1
    resourcesPerNode:
      requests:
        cpu: "2"
        memory: 16Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "6"
        memory: 28Gi
        nvidia.com/gpu: "1"
    command:
      - /bin/bash
      - -lc
    args:
      - |
        set -euo pipefail

        cat > /tmp/m2048_stability.py <<'SCRIPT_EOF'
        # Experiment 17, follow-up #2: how stable is the "GROUP_SIZE_M stays
        # at 1" outcome the cache-aware tuner produced once (out of 4 trials)
        # at gate_up_proj M=2048? With n=4 mixing three different process
        # contexts, we can't tell "real occasional near-tie" from "artifact
        # of that one run's specific context" (it ran after 89 other tune()
        # calls in the same process). This runs N_REPEATS independent
        # cache-aware-only tune() calls for the SAME (shape, M), back to
        # back in one clean, single-purpose process, and tallies the
        # GROUP_SIZE_M distribution.

        import json
        from collections import Counter

        import torch
        from tqdm import tqdm

        from vllm.model_executor.layers.quantization.utils.fp8_utils import (
            _w8a8_triton_block_scaled_mm,
        )
        from vllm.platforms import current_platform
        from vllm.triton_utils import triton

        assert current_platform.is_cuda() or current_platform.is_rocm()

        N, K = 17408, 5120  # gate_up_proj
        BLOCK_N, BLOCK_K = 128, 128
        OUT_DTYPE = torch.bfloat16
        M = 2048
        N_WEIGHT_COPIES = 64
        N_REPEATS = 10


        def w8a8_block_matmul(A, B, As, Bs, block_size, config, output_dtype=torch.float16):
            block_n, block_k = block_size[0], block_size[1]
            Mm = A.numel() // A.shape[-1]
            Nn, Kk = B.shape
            C = A.new_empty(A.shape[:-1] + (Nn,), dtype=output_dtype)

            def grid(META):
                return (
                    triton.cdiv(Mm, META["BLOCK_SIZE_M"]) * triton.cdiv(Nn, META["BLOCK_SIZE_N"]),
                )

            kernel = _w8a8_triton_block_scaled_mm
            kernel[grid](
                A, B, C, As, Bs, Mm, Nn, Kk, block_n, block_k,
                A.stride(-2), A.stride(-1),
                B.stride(1), B.stride(0),
                C.stride(-2), C.stride(-1),
                As.stride(-2), As.stride(-1),
                Bs.stride(1), Bs.stride(0),
                **config,
            )
            return C


        def get_configs_compute_bound():
            configs = []
            for num_stages in [2, 3, 4, 5]:
                for block_m in [16, 32, 64, 128, 256]:
                    for block_k in [64, 128]:
                        for block_n in [32, 64, 128, 256]:
                            for num_warps in [4, 8]:
                                for group_size in [1, 16, 32, 64]:
                                    configs.append({
                                        "BLOCK_SIZE_M": block_m,
                                        "BLOCK_SIZE_N": block_n,
                                        "BLOCK_SIZE_K": block_k,
                                        "GROUP_SIZE_M": group_size,
                                        "num_warps": num_warps,
                                        "num_stages": num_stages,
                                    })
            return configs


        def make_fp8(m, k, block_k):
            fp8_info = torch.finfo(torch.float8_e4m3fn)
            fp8_max, fp8_min = fp8_info.max, fp8_info.min
            fp32 = (torch.rand(m, k, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
            t = fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
            k_tiles = (k + block_k - 1) // block_k
            scale = torch.rand(m, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
            return t, scale


        class CyclingLaunchCounter:
            def __init__(self, copies):
                self.copies = copies
                self.i = 0

            def next(self):
                B, Bs = self.copies[self.i % len(self.copies)]
                self.i += 1
                return B, Bs


        def benchmark_config_cycling(A, As, counter, block_size, config, out_dtype, num_iters=10):
            def run():
                B, Bs = counter.next()
                w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

            torch.accelerator.synchronize()
            for _ in range(5):
                run()
            torch.accelerator.synchronize()
            start_event = torch.Event(enable_timing=True)
            end_event = torch.Event(enable_timing=True)
            latencies = []
            for _ in range(num_iters):
                torch.accelerator.synchronize()
                start_event.record()
                run()
                end_event.record()
                end_event.synchronize()
                latencies.append(start_event.elapsed_time(end_event))
            return sum(latencies) / (num_iters * 10) * 1000


        def tune_cache_aware(M, N, K, block_size, out_dtype, search_space):
            block_n, block_k = block_size
            A, As = make_fp8(M, K, block_k)
            n_tiles = (N + block_n - 1) // block_n
            k_tiles = (K + block_k - 1) // block_k

            def make_B_copy():
                fp8_info = torch.finfo(torch.float8_e4m3fn)
                fp8_max, fp8_min = fp8_info.max, fp8_info.min
                fp32 = (torch.rand(N, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                B = fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
                Bs = torch.rand(n_tiles, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
                return B, Bs

            copies = [make_B_copy() for _ in range(N_WEIGHT_COPIES)]
            torch.accelerator.synchronize()
            counter = CyclingLaunchCounter(copies)

            best_config, best_time = None, float("inf")
            for config in tqdm(search_space, desc="cache-aware"):
                try:
                    t = benchmark_config_cycling(A, As, counter, block_size, config, out_dtype)
                except triton.runtime.autotuner.OutOfResources:
                    continue
                if t < best_time:
                    best_time, best_config = t, config
            return best_config, best_time


        if __name__ == "__main__":
            torch.cuda.init()
            search_space = get_configs_compute_bound()
            print(f"search space size: {len(search_space)}", flush=True)
            print(f"M={M}, N_REPEATS={N_REPEATS}, N_WEIGHT_COPIES={N_WEIGHT_COPIES}", flush=True)

            runs = []
            for i in range(N_REPEATS):
                cfg, t = tune_cache_aware(M, N, K, [BLOCK_N, BLOCK_K], OUT_DTYPE, search_space)
                runs.append({"config": cfg, "time_us_buggy_div10": t})
                print(f"repeat {i+1}/{N_REPEATS}: GROUP_SIZE_M={cfg['GROUP_SIZE_M']}  "
                      f"full={cfg}  (avg={t:.2f}us)", flush=True)

            counts = Counter(r["config"]["GROUP_SIZE_M"] for r in runs)
            print(f"\nGROUP_SIZE_M distribution over {N_REPEATS} independent runs: "
                  f"{dict(counts)}", flush=True)

            print("\n=== RESULTS_JSON_BEGIN ===")
            print(json.dumps({"M": M, "runs": runs, "group_size_m_counts": dict(counts)},
                              indent=2, default=str))
            print("=== RESULTS_JSON_END ===")
        SCRIPT_EOF

        python3 /tmp/m2048_stability.py
