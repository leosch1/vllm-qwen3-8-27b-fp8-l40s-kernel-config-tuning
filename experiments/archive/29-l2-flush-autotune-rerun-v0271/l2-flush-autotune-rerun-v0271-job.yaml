# Full production-scope (5 shapes x 18 M) L2-flush autotune rerun, ON THE
# SAME STACK (docker.io/vllm/vllm-openai:v0.27.1) that produced this repo's
# own committed tuned-configs/ -- NOT the RHOAI production image experiment
# 24 actually used. This closes the stack-mismatch gap found in experiment
# 27's version-diag check: the blog currently compares a v0.27.1-derived
# "original tuned" config against an RHOAI-derived "L2-flush-fixed" config,
# changing two variables (the fix AND the stack) at once. This job changes
# only the fix, keeping the stack fixed at v0.27.1.
#
# Patch: benchmark_w8a8_block_fp8_l2flush.py in this folder, ported from
# experiment 24's exact L2-flush patch (resolve_l2_bytes/_FLUSH_BUF/
# benchmark_config_flush, tune() swapped to call it) onto the real,
# v0.27.1-compatible script (same one experiment 27's real-tuner-repeat
# jobs already verified imports/runs correctly on this image) instead of
# onto RHOAI's script. Everything else (search space, 5-warmup+10-timed
# iterations, the documented /10 timing bug, OutOfResources handling,
# get_weight_shapes) unchanged.
#
# NOTE: full production scope -- expect this to take a while (the original,
# unfixed v0.27.1 full run took ~133 minutes; this one adds a _FLUSH_BUF
# zero_() before every one of the 10 timed iterations per candidate, so
# plausibly longer). Also dumps every shape's config to stdout via
# CONFIG_JSON_BEGIN/END markers so results survive even if `oc cp` is
# delayed -- oc cp the whole /repo/l2-flush-tuned-configs-v0271 dir out
# before deleting this job regardless.
#
# Usage: kubectl apply -f l2-flush-autotune-rerun-v0271-job.yaml
#   kubectl get pods -n enterprise-ai | grep exp28
#   kubectl logs -f <pod> -n enterprise-ai
#   kubectl cp <pod>:/repo/l2-flush-tuned-configs-v0271 ./l2-flush-tuned-configs-v0271
#   kubectl delete -f l2-flush-autotune-rerun-v0271-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-27b-exp28-l2flush-v0271
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: gpu-autotune
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: present
      containers:
        - name: exp28-l2flush-v0271
          image: docker.io/vllm/vllm-openai:v0.27.1
          workingDir: /repo
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - mountPath: /repo
              name: repo
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 28Gi
              nvidia.com/gpu: "1"
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              mkdir -p /repo
              cat > /repo/benchmark_w8a8_block_fp8_l2flush.py <<'SCRIPT_EOF'
              # SPDX-License-Identifier: Apache-2.0
              # SPDX-FileCopyrightText: Copyright contributors to the vLLM project
              # Adapted from sglang quantization/tuning_block_wise_kernel.py

              import argparse
              import json
              import multiprocessing as mp
              import os
              import time
              from datetime import datetime
              from typing import Any

              import torch
              from tqdm import tqdm

              from vllm.model_executor.layers.quantization.utils.fp8_utils import (
                  _w8a8_triton_block_scaled_mm,
              )
              from vllm.platforms import current_platform
              from vllm.triton_utils import triton
              from vllm.utils.argparse_utils import FlexibleArgumentParser
              from vllm.utils.platform_utils import get_device_name_as_file_name

              mp.set_start_method("spawn", force=True)

              assert current_platform.is_cuda() or current_platform.is_rocm(), (
                  "Only support tune w8a8 block fp8 kernel on CUDA/ROCm device."
              )

              DTYPE_MAP = {
                  "float32": torch.float32,
                  "float16": torch.float16,
                  "half": torch.half,
                  "bfloat16": torch.bfloat16,
              }


              def w8a8_block_matmul(
                  A: torch.Tensor,
                  B: torch.Tensor,
                  As: torch.Tensor,
                  Bs: torch.Tensor,
                  block_size: list[int],
                  config: dict[str, Any],
                  output_dtype: torch.dtype = torch.float16,
              ) -> torch.Tensor:
                  """This function performs matrix multiplication with
                  block-wise quantization.

                  It takes two input tensors `A` and `B` with scales `As` and `Bs`.
                  The output is returned in the specified `output_dtype`.

                  Args:
                      A: The input tensor, e.g., activation.
                      B: The input tensor, e.g., weight.
                      As: The per-token-group quantization scale for `A`.
                      Bs: The per-block quantization scale for `B`.
                      block_size: The block size for per-block quantization.
                                  It should be 2-dim, e.g., [128, 128].
                      output_dtype: The dtype of the returned tensor.

                  Returns:
                      torch.Tensor: The result of matmul.
                  """
                  assert len(block_size) == 2
                  block_n, block_k = block_size[0], block_size[1]

                  assert A.shape[-1] == B.shape[-1]
                  assert A.shape[:-1] == As.shape[:-1] and A.is_contiguous()
                  assert triton.cdiv(A.shape[-1], block_k) == As.shape[-1]
                  M = A.numel() // A.shape[-1]

                  assert B.ndim == 2 and B.is_contiguous() and Bs.ndim == 2
                  N, K = B.shape
                  assert triton.cdiv(N, block_n) == Bs.shape[0]
                  assert triton.cdiv(K, block_k) == Bs.shape[1]

                  C_shape = A.shape[:-1] + (N,)
                  C = A.new_empty(C_shape, dtype=output_dtype)

                  def grid(META):
                      return (
                          triton.cdiv(M, META["BLOCK_SIZE_M"]) * triton.cdiv(N, META["BLOCK_SIZE_N"]),
                      )

                  if A.dtype == torch.float8_e4m3fn:
                      kernel = _w8a8_triton_block_scaled_mm
                  else:
                      raise RuntimeError("Currently, only support tune w8a8 block fp8 kernel.")

                  kernel[grid](
                      A,
                      B,
                      C,
                      As,
                      Bs,
                      M,
                      N,
                      K,
                      block_n,
                      block_k,
                      A.stride(-2),
                      A.stride(-1),
                      B.stride(1),
                      B.stride(0),
                      C.stride(-2),
                      C.stride(-1),
                      As.stride(-2),
                      As.stride(-1),
                      Bs.stride(1),
                      Bs.stride(0),
                      **config,
                  )

                  return C


              def get_configs_compute_bound():
                  configs = []
                  for num_stages in [2, 3, 4, 5]:
                      for block_m in [16, 32, 64, 128, 256]:
                          for block_k in [64, 128]:
                              for block_n in [32, 64, 128, 256]:
                                  for num_warps in [4, 8]:
                                      for group_size in [1, 16, 32, 64]:
                                          configs.append(
                                              {
                                                  "BLOCK_SIZE_M": block_m,
                                                  "BLOCK_SIZE_N": block_n,
                                                  "BLOCK_SIZE_K": block_k,
                                                  "GROUP_SIZE_M": group_size,
                                                  "num_warps": num_warps,
                                                  "num_stages": num_stages,
                                              }
                                          )
                  return configs


              def get_weight_shapes(tp_size):
                  # Qwen/Qwen3.8-27B-FP8, tensor_parallel_size=2 dense W8A8 block-FP8 shapes.
                  # Captured from the live predictor pod's "Using default..." warnings, and
                  # cross-checked against the model's config.json. See
                  # https://github.com/leosch1/vllm-qwen3-8-27b-fp8-l40s-kernel-config-tuning
                  # for the full methodology and results this branch's tuning run backs.
                  return [
                      (17408, 5120),
                      (8192, 5120),
                      (7168, 5120),
                      (5120, 8704),
                      (5120, 3072),
                  ]

                  # NOTE(HandH1998): The weight shapes only works for DeepSeek-V3.
                  # Modify them, if you tune for another different model.
                  # cannot TP
                  total = [
                      (512 + 64, 7168),
                      (2112, 7168),
                      ((128 + 64) * 128, 7168),
                      (128 * (128 + 128), 512),
                      (7168, 16384),
                      (7168, 18432),
                  ]
                  # N can TP
                  n_tp = [
                      (18432 * 2, 7168),
                      ((128 + 64) * 128, 7168),
                      (128 * (128 + 128), 512),
                      (24576, 1536),
                      (12288, 7168),
                      (4096, 7168),
                  ]
                  # K can TP
                  k_tp = [(7168, 18432), (7168, 16384), (7168, 2048)]

                  weight_shapes = []
                  for t in total:
                      weight_shapes.append(t)
                  for n_t in n_tp:
                      new_t = (n_t[0] // tp_size, n_t[1])
                      weight_shapes.append(new_t)
                  for k_t in k_tp:
                      new_t = (k_t[0], k_t[1] // tp_size)
                      weight_shapes.append(new_t)
                  return weight_shapes


              def benchmark_config(
                  A, B, As, Bs, block_size, config, out_dtype=torch.float16, num_iters=10
              ):
                  def run():
                      w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

                  torch.accelerator.synchronize()
                  # JIT complication & warmup
                  for _ in range(5):
                      run()
                  torch.accelerator.synchronize()

                  start_event = torch.Event(enable_timing=True)
                  end_event = torch.Event(enable_timing=True)

                  latencies: list[float] = []
                  for i in range(num_iters):
                      torch.accelerator.synchronize()
                      start_event.record()
                      run()
                      end_event.record()
                      end_event.synchronize()
                      latencies.append(start_event.elapsed_time(end_event))
                  avg = sum(latencies) / (num_iters * 10) * 1000  # us
                  return avg


              # ============================================================
              # EXP28 CHANGE (porting experiment 24's L2-flush patch onto the v0.27.1
              # stack instead of the RHOAI image experiment 24 actually used -- see
              # experiments/27's version-diag findings for why that stack mismatch
              # matters). Everything below this block and inside tune() is the only
              # diff from the real, unmodified v0.27.1-based script above.
              # ============================================================
              FALLBACK_L2_BYTES = 128 * 1024 * 1024


              def resolve_l2_bytes():
                  device = torch.cuda.current_device()
                  try:
                      l2 = torch.cuda.get_device_properties(device).L2_cache_size
                      if l2 and l2 > 0:
                          print(f"resolved L2_cache_size from device properties: {l2/1e6:.1f}MB",
                                flush=True)
                          return l2
                  except AttributeError:
                      pass
                  print(f"WARNING: L2_cache_size not exposed by this PyTorch build, "
                        f"falling back to {FALLBACK_L2_BYTES/1e6:.0f}MB", flush=True)
                  return FALLBACK_L2_BYTES


              _L2_BYTES = resolve_l2_bytes()
              _FLUSH_BUF = torch.empty(int(_L2_BYTES * 1.5) // 4, dtype=torch.int32, device="cuda")


              def benchmark_config_flush(A, B, As, Bs, block_size, config, out_dtype, num_iters=10):
                  def run():
                      w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

                  torch.accelerator.synchronize()
                  for _ in range(5):
                      run()  # warmup: JIT compile only, doesn't need a cold cache
                  torch.accelerator.synchronize()

                  start_event = torch.Event(enable_timing=True)
                  end_event = torch.Event(enable_timing=True)
                  latencies: list[float] = []
                  for _ in range(num_iters):
                      _FLUSH_BUF.zero_()  # force eviction of A/B/C from L2 before this launch
                      torch.accelerator.synchronize()
                      start_event.record()
                      run()
                      end_event.record()
                      end_event.synchronize()
                      latencies.append(start_event.elapsed_time(end_event))
                  avg = sum(latencies) / (num_iters * 10) * 1000  # us
                  return avg
              # ============================================================
              # END EXP28 CHANGE (part 1) -- tune() below has ONE further change: it
              # calls benchmark_config_flush instead of benchmark_config.
              # ============================================================


              def tune(M, N, K, block_size, out_dtype, search_space, input_type):
                  factor_for_scale = 1e-2

                  if input_type == "fp8":
                      fp8_info = torch.finfo(torch.float8_e4m3fn)
                      fp8_max, fp8_min = fp8_info.max, fp8_info.min

                      A_fp32 = (
                          (torch.rand(M, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                      )
                      A = A_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)

                      B_fp32 = (
                          (torch.rand(N, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                      )
                      B = B_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
                  else:
                      raise RuntimeError("Currently, only support tune w8a8 block fp8 kernel.")

                  block_n, block_k = block_size[0], block_size[1]
                  n_tiles = (N + block_n - 1) // block_n
                  k_tiles = (K + block_k - 1) // block_k

                  As = torch.rand(M, k_tiles, dtype=torch.float32, device="cuda") * factor_for_scale
                  Bs = (
                      torch.rand(n_tiles, k_tiles, dtype=torch.float32, device="cuda")
                      * factor_for_scale
                  )

                  best_config = None
                  best_time = float("inf")
                  for config in tqdm(search_space):
                      try:
                          kernel_time = benchmark_config_flush(
                              A,
                              B,
                              As,
                              Bs,
                              block_size,
                              config,
                              out_dtype,
                              num_iters=10,
                          )
                      except triton.runtime.autotuner.OutOfResources:
                          # Some configurations may be invalid and fail to compile.
                          continue

                      if kernel_time < best_time:
                          best_time = kernel_time
                          best_config = config
                  now = datetime.now()
                  print(f"{now.ctime()}] Completed tuning for batch_size={M}")
                  assert best_config is not None
                  return best_config


              def save_configs(
                  N,
                  K,
                  block_n,
                  block_k,
                  configs,
                  save_path,
                  input_type="fp8",
              ) -> None:
                  os.makedirs(save_path, exist_ok=True)
                  device_name = get_device_name_as_file_name()
                  json_file_name = (
                      f"N={N},K={K},device_name={device_name},dtype={input_type}_w8a8,"
                      f"block_shape=[{block_n},{block_k}].json"
                  )

                  config_file_path = os.path.join(save_path, json_file_name)
                  print(f"Writing best config to {config_file_path}...")

                  with open(config_file_path, "w") as f:
                      json.dump(configs, f, indent=4)
                      f.write("\n")

                  print(f"=== CONFIG_JSON_BEGIN {json_file_name} ===", flush=True)
                  print(json.dumps(configs, indent=2), flush=True)
                  print(f"=== CONFIG_JSON_END {json_file_name} ===", flush=True)


              def tune_on_gpu(args_dict):
                  """Run tuning on a specific GPU."""
                  gpu_id = args_dict["gpu_id"]
                  batch_sizes = args_dict["batch_sizes"]
                  weight_shapes = args_dict["weight_shapes"]
                  args = args_dict["args"]

                  torch.accelerator.set_device_index(gpu_id)
                  print(f"Starting tuning on GPU {gpu_id} with batch sizes {batch_sizes}")

                  block_n = args.block_n
                  block_k = args.block_k
                  out_dtype = DTYPE_MAP[args.out_dtype]
                  save_path = args.save_path
                  input_type = args.input_type

                  search_space = get_configs_compute_bound()
                  search_space = [
                      config for config in search_space if block_k % config["BLOCK_SIZE_K"] == 0
                  ]

                  start = time.time()
                  for shape in tqdm(weight_shapes, desc=f"GPU {gpu_id} - Shapes"):
                      N, K = shape[0], shape[1]
                      print(f"[GPU {gpu_id}] Tune for weight shape of `N: {N}, K: {K}`")
                      benchmark_results = [
                          tune(
                              batch_size,
                              N,
                              K,
                              [block_n, block_k],
                              out_dtype,
                              search_space,
                              input_type,
                          )
                          for batch_size in tqdm(batch_sizes, desc=f"GPU {gpu_id} - Batch sizes")
                      ]
                      best_configs = {M: config for M, config in zip(batch_sizes, benchmark_results)}
                      save_configs(N, K, block_n, block_k, best_configs, save_path, input_type)

                  end = time.time()
                  print(f"Tuning on GPU {gpu_id} took {end - start:.2f} seconds")


              def distribute_batch_sizes(batch_sizes, num_gpus):
                  """Distribute batch sizes across available GPUs."""
                  batches_per_gpu = []
                  for i in range(num_gpus):
                      start_idx = i * len(batch_sizes) // num_gpus
                      end_idx = (i + 1) * len(batch_sizes) // num_gpus
                      batches_per_gpu.append(batch_sizes[start_idx:end_idx])
                  return batches_per_gpu


              def main(args):
                  print(args)
                  num_gpus = torch.accelerator.device_count()
                  if num_gpus == 0:
                      raise RuntimeError("No GPU available for tuning")
                  print(f"Found {num_gpus} GPUs for parallel tuning")

                  torch.cuda.init()

                  if args.batch_size is None:
                      batch_sizes = [
                          1,
                          2,
                          4,
                          8,
                          16,
                          24,
                          32,
                          48,
                          64,
                          96,
                          128,
                          256,
                          512,
                          1024,
                          1536,
                          2048,
                          3072,
                          4096,
                      ]
                  else:
                      batch_sizes = [args.batch_size]
                      num_gpus = 1  # If only one batch size, use only one GPU

                  weight_shapes = get_weight_shapes(args.tp_size)

                  batches_per_gpu = distribute_batch_sizes(batch_sizes, num_gpus)

                  process_args = []
                  for gpu_id in range(num_gpus):
                      process_args.append(
                          {
                              "gpu_id": gpu_id,
                              "batch_sizes": batches_per_gpu[gpu_id],
                              "weight_shapes": weight_shapes,  # Each GPU processes all weight shapes
                              "args": args,
                          }
                      )

                  ctx = mp.get_context("spawn")
                  with ctx.Pool(num_gpus) as pool:
                      pool.map(tune_on_gpu, process_args)

                  print("Multi-GPU tuning completed")


              if __name__ == "__main__":
                  parser = FlexibleArgumentParser(
                      description="""
              Tune triton w8a8 block fp8 for DeepSeek-V3/DeepSeek-R1:
                  python3 benchmark_w8a8_block_fp8.py --tp-size 8 --input-type fp8
              Then copy to model_executor/layers/quantization/utils/configs
                      """,
                      formatter_class=argparse.RawTextHelpFormatter,
                  )

                  parser.add_argument("--tp-size", "-tp", type=int, default=8)
                  parser.add_argument("--input-type", type=str, choices=["fp8"], default="fp8")
                  parser.add_argument(
                      "--out-dtype",
                      type=str,
                      choices=["float32", "float16", "bfloat16", "half"],
                      default="float16",
                  )
                  parser.add_argument("--block-n", type=int, default=128)
                  parser.add_argument("--block-k", type=int, default=128)
                  parser.add_argument("--batch-size", type=int, required=False)
                  parser.add_argument("--save-path", type=str, default="/repo/l2-flush-tuned-configs-v0271")
                  args = parser.parse_args()

                  main(args)
              SCRIPT_EOF

              python3 /repo/benchmark_w8a8_block_fp8_l2flush.py \
                  --tp-size 2 --input-type fp8 --out-dtype bfloat16 \
                  --block-n 128 --block-k 128
              echo "=== final file listing ==="
              ls -la /repo/l2-flush-tuned-configs-v0271
              echo "=== done, sleeping so logs/files can be read ==="
              sleep infinity
      volumes:
        - name: repo
          emptyDir: {}
