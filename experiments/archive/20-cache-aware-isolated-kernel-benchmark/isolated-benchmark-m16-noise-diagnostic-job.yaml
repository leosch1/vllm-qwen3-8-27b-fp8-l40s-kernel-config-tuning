# gate_up_proj M=2048 did (Part 9), or much wider noise? Distinguishes
# time-drift (round-robin across points would help) from heteroscedastic
# per-kernel-size noise (round-robin wouldn't help). M=16 is a point where
# tuned and singlefix are byte-identical (singlefix only changes M=2048),
# so the true effect here is exactly 0 -- purely a noise-floor probe.
