  name: qwen3-8-27b-tuned-vs-singlefix-isolated-cycling
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: gpu-autotune
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: present
      containers:
        - name: isolated-benchmark-tuned-vs-singlefix-cycling
          image: docker.io/vllm/vllm-openai:v0.27.1
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
