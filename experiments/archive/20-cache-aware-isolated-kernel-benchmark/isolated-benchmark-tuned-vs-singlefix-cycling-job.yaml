# Isolated kernel benchmark: tuned vs. singlefix (22's maximally-narrow
# config), DIRECTLY paired in the same run -- not chained through separate
# vs-default passes (see script docstring for why that was tried first and
# found too noisy). Plain Job, matching 19's own pattern.
