              echo "=== writing order-balanced interleaved check script ==="
              cat > /tmp/compare_tuned_vs_singlefix_m2048_interleaved_balanced.py <<'SCRIPT_EOF'
              """
              Order-balanced fine-grained interleaved design at gate_up_proj M=2048.

              Two prior findings motivate this:
              1. Fine-grained interleaving (alternating tuned/singlefix on the IDENTICAL
                 weight tensor every round, instead of two full sequential 2000-iteration
                 blocks) tightened between-repeat noise a lot (stdev 0.33pp vs. Part 9's
                 0.74pp) -- consistent with canceling transient external perturbations
                 that would otherwise hit one config's whole block disproportionately.
              2. But it also introduced a real, confirmed ORDER bias: running tuned
                 first/singlefix second gave +9.91%; swapping to singlefix
                 first/tuned second gave +6.23% -- whichever config runs SECOND in a
                 round gets a spurious cache-warming boost from the first having just
                 pulled the identical tensor into L2 microseconds earlier.

              Fix: alternate WHICH config runs first every single round (not every
              repeat) -- exactly 1000 of the 2000 rounds run tuned-then-singlefix, the
              other 1000 run singlefix-then-tuned. This cancels the order bias within
              a single measurement (no need to average across separately-ordered runs)
              while keeping the tight temporal interleaving that canceled the transient-
              perturbation noise in the first place.
              """

              import json
              import statistics

              import torch

              from vllm.model_executor.layers.quantization.utils.fp8_utils import (
                  _w8a8_triton_block_scaled_mm,
              )
              from vllm.triton_utils import triton
              from vllm.utils.platform_utils import get_device_name_as_file_name


              def w8a8_block_matmul(A, B, As, Bs, block_size, config, output_dtype=torch.float16):
                  block_n, block_k = block_size[0], block_size[1]
                  M = A.numel() // A.shape[-1]
                  N, K = B.shape
                  C = A.new_empty(A.shape[:-1] + (N,), dtype=output_dtype)

                  def grid(META):
                      return (triton.cdiv(M, META["BLOCK_SIZE_M"]) * triton.cdiv(N, META["BLOCK_SIZE_N"]),)

                  kernel = _w8a8_triton_block_scaled_mm
                  kernel[grid](
                      A, B, C, As, Bs, M, N, K, block_n, block_k,
                      A.stride(-2), A.stride(-1),
                      B.stride(1), B.stride(0),
                      C.stride(-2), C.stride(-1),
                      As.stride(-2), As.stride(-1),
                      Bs.stride(1), Bs.stride(0),
                      **config,
                  )
                  return C


              def time_one(A, B, As, Bs, block_size, config, out_dtype, start_event, end_event):
                  torch.accelerator.synchronize()
                  start_event.record()
                  w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)
                  end_event.record()
                  end_event.synchronize()
                  return start_event.elapsed_time(end_event)


              def benchmark_interleaved_balanced(A, As, copies, block_size, config_tuned, config_singlefix, out_dtype, num_iters=2000):
                  """Alternates WHICH config runs first every round: even rounds
                  tuned-then-singlefix, odd rounds singlefix-then-tuned. Same weight
                  tensor for both configs within a round (cancels transient noise);
                  order alternates (cancels order bias). Returns (mean_t, mean_s)."""
                  start_event = torch.Event(enable_timing=True)
                  end_event = torch.Event(enable_timing=True)

                  for i in range(5):
                      B, Bs = copies[i % len(copies)]
                      if i % 2 == 0:
                          time_one(A, B, As, Bs, block_size, config_tuned, out_dtype, start_event, end_event)
                          time_one(A, B, As, Bs, block_size, config_singlefix, out_dtype, start_event, end_event)
                      else:
                          time_one(A, B, As, Bs, block_size, config_singlefix, out_dtype, start_event, end_event)
                          time_one(A, B, As, Bs, block_size, config_tuned, out_dtype, start_event, end_event)

                  lat_t, lat_s = [], []
                  for i in range(num_iters):
                      B, Bs = copies[i % len(copies)]
                      if i % 2 == 0:
                          lat_t.append(time_one(A, B, As, Bs, block_size, config_tuned, out_dtype, start_event, end_event))
                          lat_s.append(time_one(A, B, As, Bs, block_size, config_singlefix, out_dtype, start_event, end_event))
                      else:
                          lat_s.append(time_one(A, B, As, Bs, block_size, config_singlefix, out_dtype, start_event, end_event))
                          lat_t.append(time_one(A, B, As, Bs, block_size, config_tuned, out_dtype, start_event, end_event))

                  def mean_us(latencies):
                      return statistics.mean(l * 1000.0 / 10 for l in latencies)

                  return mean_us(lat_t), mean_us(lat_s)


              TUNED_DIR = "/tmp/tuned-configs"
              SINGLEFIX_DIR = "/tmp/singlefix-configs"
              N, K = 17408, 5120
              M = 2048
              BLOCK_N, BLOCK_K = 128, 128
              OUT_DTYPE = torch.bfloat16
              NUM_ITERS = 2000
              N_WEIGHT_COPIES = 64
              N_REPEATS = 10


              def make_A(M, K, block_k):
                  fp8_info = torch.finfo(torch.float8_e4m3fn)
                  fp8_max, fp8_min = fp8_info.max, fp8_info.min
                  A_fp32 = (torch.rand(M, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                  A = A_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
                  k_tiles = (K + block_k - 1) // block_k
                  As = torch.rand(M, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
                  return A, As


              def make_B_copies(N, K, block_n, block_k, count):
                  fp8_info = torch.finfo(torch.float8_e4m3fn)
                  fp8_max, fp8_min = fp8_info.max, fp8_info.min
                  n_tiles = (N + block_n - 1) // block_n
                  k_tiles = (K + block_k - 1) // block_k
                  copies = []
                  for _ in range(count):
                      B_fp32 = (torch.rand(N, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                      B = B_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
                      Bs = torch.rand(n_tiles, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
                      copies.append((B, Bs))
                  return copies


              def main():
                  torch.cuda.init()
                  device_name = get_device_name_as_file_name()

                  tuned_json_path = f"{TUNED_DIR}/N={N},K={K},device_name={device_name},dtype=fp8_w8a8,block_shape=[{BLOCK_N},{BLOCK_K}].json"
                  singlefix_json_path = f"{SINGLEFIX_DIR}/N={N},K={K},device_name={device_name},dtype=fp8_w8a8,block_shape=[{BLOCK_N},{BLOCK_K}].json"
                  with open(tuned_json_path) as f:
                      tuned_config = json.load(f)[str(M)]
                  with open(singlefix_json_path) as f:
                      singlefix_config = json.load(f)[str(M)]

                  print(f"tuned_config[{M}] = {tuned_config}")
                  print(f"singlefix_config[{M}] = {singlefix_config}")
                  print()
                  print(f"### gate_up_proj (N={N}, K={K}), M={M}, {N_REPEATS} repeats, ORDER-BALANCED interleaved design")
                  print("| repeat | tuned_mean | singlefix_mean | speedup |")
                  print("|---:|---:|---:|---:|")

                  speedups = []
                  for repeat in range(1, N_REPEATS + 1):
                      A, As = make_A(M, K, BLOCK_K)
                      copies = make_B_copies(N, K, BLOCK_N, BLOCK_K, N_WEIGHT_COPIES)
                      torch.accelerator.synchronize()

                      t_mean, s_mean = benchmark_interleaved_balanced(
                          A, As, copies, [BLOCK_N, BLOCK_K], tuned_config, singlefix_config, OUT_DTYPE, num_iters=NUM_ITERS,
                      )
                      speedup = (t_mean - s_mean) / t_mean * 100
                      speedups.append(speedup)
                      print(f"| {repeat} | {t_mean:.3f} | {s_mean:.3f} | {speedup:+.2f}% |")

                  mean = statistics.mean(speedups)
                  stdev = statistics.stdev(speedups)
                  sem = stdev / (len(speedups) ** 0.5)
                  n_positive = sum(1 for s in speedups if s > 0)
                  print()
                  print(f"observed speedup values: {[round(s,2) for s in speedups]}")
                  print(f"mean: {mean:+.2f}%, stdev: {stdev:.2f}pp, SEM: {sem:.2f}pp")
                  print(f"{n_positive}/{len(speedups)} repeats positive")
                  print(f"95% CI (approx, t~2.26 for n=10): [{mean - 2.26*sem:+.2f}%, {mean + 2.26*sem:+.2f}%]")


              if __name__ == "__main__":
                  main()
              SCRIPT_EOF

              echo "=== running order-balanced interleaved check ==="
              python3 /tmp/compare_tuned_vs_singlefix_m2048_interleaved_balanced.py
