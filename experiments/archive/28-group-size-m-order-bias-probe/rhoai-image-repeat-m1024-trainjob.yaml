# Cross-check for experiment 17's "the original tuner is perfectly stable,
# every run, GROUP_SIZE_M=1 every time" claim (4/4 at M=1024) -- but run on
# the SAME image/runtimeRef experiment 17 actually used
# (registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0-..., matching production's
# real qwen3-8-27b-fp8-dense-autotune TrainJob), NOT the upstream
# vllm-openai:v0.27.1 image used by ../../../k8s/tune-job.yaml (which is what
# actually produced this repo's own committed tuned-configs/, and what
# experiments/27's real-tuner-repeat-m1024-job.yaml already tested: 0/6 fresh
# runs there reproduced GROUP_SIZE_M=1).
#
# tune_original() here is copied verbatim from experiment 17's own
# noise_floor_trainjob.yaml (the exact "original" condition it already
# validated works on this image) -- not reconstructed from scratch.
#
# Usage: oc apply -f rhoai-image-repeat-m1024-trainjob.yaml
#   oc get pods -n enterprise-ai | grep rhoai-repeat
#   oc logs <pod> -n enterprise-ai | grep -v 'it/s\]'
#   oc delete -f rhoai-image-repeat-m1024-trainjob.yaml
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: qwen3-8-27b-exp27-rhoai-repeat
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  runtimeRef:
    name: torch-distributed-cuda130-torch210-py312
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
  trainer:
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0-1786533823
    numNodes: 1
    numProcPerNode: 1
    resourcesPerNode:
      requests:
        cpu: "2"
        memory: 16Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "6"
        memory: 28Gi
        nvidia.com/gpu: "1"
    command:
      - /bin/bash
      - -lc
    args:
      - |
        set -euo pipefail

        cat > /tmp/rhoai_repeat.py <<'SCRIPT_EOF'
        # Repeats experiment 17's own tune_original() (verbatim, copied from
        # noise_floor_trainjob.yaml) 3x independently at M=1024, gate_up_proj
        # only, to see if it reproduces the "always GROUP_SIZE_M=1" result on
        # THIS image, as experiment 17 originally found (4/4 runs).

        import json

        import torch
        from tqdm import tqdm

        from vllm.model_executor.layers.quantization.utils.fp8_utils import (
            _w8a8_triton_block_scaled_mm,
        )
        from vllm.platforms import current_platform
        from vllm.triton_utils import triton

        assert current_platform.is_cuda() or current_platform.is_rocm()

        N, K = 17408, 5120  # gate_up_proj
        BLOCK_N, BLOCK_K = 128, 128
        OUT_DTYPE = torch.bfloat16
        M = 1024
        N_REPEATS = 3


        def w8a8_block_matmul(A, B, As, Bs, block_size, config, output_dtype=torch.float16):
            block_n, block_k = block_size[0], block_size[1]
            M = A.numel() // A.shape[-1]
            N, K = B.shape
            C = A.new_empty(A.shape[:-1] + (N,), dtype=output_dtype)

            def grid(META):
                return (
                    triton.cdiv(M, META["BLOCK_SIZE_M"]) * triton.cdiv(N, META["BLOCK_SIZE_N"]),
                )

            kernel = _w8a8_triton_block_scaled_mm
            kernel[grid](
                A, B, C, As, Bs, M, N, K, block_n, block_k,
                A.stride(-2), A.stride(-1),
                B.stride(1), B.stride(0),
                C.stride(-2), C.stride(-1),
                As.stride(-2), As.stride(-1),
                Bs.stride(1), Bs.stride(0),
                **config,
            )
            return C


        def get_configs_compute_bound():
            configs = []
            for num_stages in [2, 3, 4, 5]:
                for block_m in [16, 32, 64, 128, 256]:
                    for block_k in [64, 128]:
                        for block_n in [32, 64, 128, 256]:
                            for num_warps in [4, 8]:
                                for group_size in [1, 16, 32, 64]:
                                    configs.append({
                                        "BLOCK_SIZE_M": block_m,
                                        "BLOCK_SIZE_N": block_n,
                                        "BLOCK_SIZE_K": block_k,
                                        "GROUP_SIZE_M": group_size,
                                        "num_warps": num_warps,
                                        "num_stages": num_stages,
                                    })
            return configs


        def benchmark_config(A, B, As, Bs, block_size, config, out_dtype, num_iters=10):
            def run():
                w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

            torch.accelerator.synchronize()
            for _ in range(5):
                run()
            torch.accelerator.synchronize()
            start_event = torch.Event(enable_timing=True)
            end_event = torch.Event(enable_timing=True)
            latencies = []
            for _ in range(num_iters):
                torch.accelerator.synchronize()
                start_event.record()
                run()
                end_event.record()
                end_event.synchronize()
                latencies.append(start_event.elapsed_time(end_event))
            return sum(latencies) / (num_iters * 10) * 1000


        def make_fp8(m, k, block_k):
            fp8_info = torch.finfo(torch.float8_e4m3fn)
            fp8_max, fp8_min = fp8_info.max, fp8_info.min
            fp32 = (torch.rand(m, k, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
            t = fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
            k_tiles = (k + block_k - 1) // block_k
            scale = torch.rand(m, k_tiles, dtype=torch.float32, device="cuda") * 1e-2
            return t, scale


        def tune_original(M, N, K, block_size, out_dtype, search_space):
            """Real script's tune(), verbatim methodology: ONE A/B pair, reused
            across all candidates. Copied verbatim from experiment 17's own
            noise_floor_trainjob.yaml."""
            block_n, block_k = block_size
            A, As = make_fp8(M, K, block_k)
            B, Bs = make_fp8(N, K, block_k)
            n_tiles = (N + block_n - 1) // block_n
            Bs = torch.rand(n_tiles, Bs.shape[1], dtype=torch.float32, device="cuda") * 1e-2

            best_config, best_time = None, float("inf")
            for config in tqdm(search_space, desc="original"):
                try:
                    t = benchmark_config(A, B, As, Bs, block_size, config, out_dtype)
                except triton.runtime.autotuner.OutOfResources:
                    continue
                if t < best_time:
                    best_time, best_config = t, config
            return best_config, best_time


        if __name__ == "__main__":
            torch.cuda.init()
            search_space = get_configs_compute_bound()
            print(f"search space size: {len(search_space)}", flush=True)

            results = []
            for i in range(N_REPEATS):
                print(f"\n=== RHOAI IMAGE run {i+1}/{N_REPEATS}, M={M}, gate_up_proj ===", flush=True)
                best_config, best_time = tune_original(
                    M, N, K, [BLOCK_N, BLOCK_K], OUT_DTYPE, search_space
                )
                print(f"  run {i+1} result: {best_config}  (avg={best_time:.2f}us)", flush=True)
                results.append(best_config)

            print("\n=== FULL SUMMARY (RHOAI image, M=1024, gate_up_proj, tune_original x3) ===")
            for i, cfg in enumerate(results):
                print(f"run {i+1}: {cfg}")
            print("\nRaw JSON:")
            print(json.dumps(results, indent=2))
        SCRIPT_EOF

        python3 /tmp/rhoai_repeat.py
        echo "=== done, sleeping so logs can be read ==="
        sleep infinity
