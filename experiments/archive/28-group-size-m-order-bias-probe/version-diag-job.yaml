# Quick, cheap diagnostic: compares vLLM/Triton/CUDA versions and the actual
# _w8a8_triton_block_scaled_mm kernel source between the two images used in
# this investigation -- upstream vllm-openai:v0.27.1 (what produced this
# repo's own committed tuned-configs/) vs. the RHOAI production image
# (registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0-..., what experiment 17's
# stability check and today's cross-check ran on). No tuning, just imports
# and prints -- should finish in well under a minute.
#
# Usage: kubectl apply -f version-diag-job.yaml
#   kubectl logs -l app=version-diag-v027 -n enterprise-ai
#   kubectl logs -l app=version-diag-rhoai -n enterprise-ai
#   kubectl delete -f version-diag-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-27b-exp27-version-diag-v027
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: gpu-autotune
        app: version-diag-v027
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: present
      containers:
        - name: version-diag
          image: docker.io/vllm/vllm-openai:v0.27.1
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              python3 -c "
              import inspect
              import torch
              import vllm
              import triton
              from vllm.model_executor.layers.quantization.utils.fp8_utils import _w8a8_triton_block_scaled_mm
              print('=== IMAGE: vllm-openai:v0.27.1 ===')
              print('vllm.__version__      =', vllm.__version__, flush=True)
              print('triton.__version__     =', triton.__version__, flush=True)
              print('torch.__version__      =', torch.__version__, flush=True)
              print('torch.version.cuda     =', torch.version.cuda, flush=True)
              print('gpu name               =', torch.cuda.get_device_name(0), flush=True)
              print(flush=True)
              print('=== _w8a8_triton_block_scaled_mm source ===', flush=True)
              try:
                  print(inspect.getsource(_w8a8_triton_block_scaled_mm.fn), flush=True)
              except Exception as e:
                  print('getsource(.fn) failed:', repr(e), flush=True)
                  try:
                      print(_w8a8_triton_block_scaled_mm.src, flush=True)
                  except Exception as e2:
                      print('.src also failed:', repr(e2), flush=True)
              " 2>&1
              echo "=== done, sleeping so logs can be read ==="
              sleep infinity
---
