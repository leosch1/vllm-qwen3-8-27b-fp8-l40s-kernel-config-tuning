# Runs the REAL, unmodified autotuning script this project actually used
# (leosch1/vllm@qwen3-8-27b-fp8-dense-tuning -- same fork/branch/command as
# ../../../k8s/tune-job.yaml, which produced this repo's own tuned-configs/*.json)
# -- not a probe or approximation -- restricted to a single batch size
# (M=1024) via --batch-size, and repeated 3 times in the SAME pod (so
# Triton's compile cache warms up after the first pass, keeping repeats 2/3
# fast) to see whether the real, complete 1280-candidate search reliably
# lands on GROUP_SIZE_M=1 for gate_up_proj at M=1024, or varies run to run --
# closing the gap the isolated 4-candidate probe in this same folder
# couldn't: this is the actual script, actual execution context, actual
# full competition against all ~320 other BLOCK_SIZE/num_warps/num_stages
# combinations, not an approximation of it.
#
# Usage: kubectl apply -f real-tuner-repeat-m1024-job.yaml
#   kubectl logs -f <pod>
#   kubectl delete -f real-tuner-repeat-m1024-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-27b-exp27-real-tuner-repeat
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: gpu-autotune
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: present
      initContainers:
        - name: clone-repo
          image: docker.io/alpine/git:latest
          args:
            - clone
            - --depth=1
            - --branch=qwen3-8-27b-fp8-dense-tuning
            - https://github.com/leosch1/vllm.git
            - /repo
          volumeMounts:
            - mountPath: /repo
              name: repo
      containers:
        - name: real-tuner-repeat
          image: docker.io/vllm/vllm-openai:v0.27.1
          workingDir: /repo/benchmarks/kernels
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 28Gi
              nvidia.com/gpu: "1"
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              for i in 1 2 3; do
                echo "=========================================="
                echo "=== REAL TUNER RUN $i/3 (M=1024, all 5 shapes, batch-size fixed) ==="
                echo "=========================================="
                python3 benchmark_w8a8_block_fp8.py \
                    --tp-size 2 --input-type fp8 --out-dtype bfloat16 \
                    --block-n 128 --block-k 128 --batch-size 1024 \
                    --save-path /repo/tuned-configs-run$i
              done

              echo ""
              echo "=== gate_up_proj (N=17408,K=5120) GROUP_SIZE_M at M=1024, all 3 runs ==="
              for i in 1 2 3; do
                echo "--- run $i ---"
                python3 -c "
              import json
              with open('/repo/tuned-configs-run$i/N=17408,K=5120,device_name=NVIDIA_L40S,dtype=fp8_w8a8,block_shape=[128,128].json') as f:
                  d = json.load(f)
              print(json.dumps(d['1024'], indent=2))
              "
              done

              echo "=== done, sleeping so logs can be read ==="
              sleep infinity
          volumeMounts:
            - mountPath: /repo
              name: repo
      volumes:
        - name: repo
          emptyDir: {}
