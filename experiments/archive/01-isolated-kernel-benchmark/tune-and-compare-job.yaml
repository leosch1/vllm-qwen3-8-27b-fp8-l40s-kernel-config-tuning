# One-off evidence-gathering run for a potential upstream vllm-project/vllm PR —
# deliberately NOT referenced in kustomization.yaml, so ArgoCD never manages it.
# Apply/delete manually: `oc apply -f` to run, `oc cp` the results out of the pod
# while it's sleeping at the end, then `oc delete -f` when done.
#
# Unlike the production autotune TrainJobs in this directory, this doesn't need
# Kueue's gpu-autotune queue (no ResourceQuota ties GPU scheduling to it) or a
# PVC (nothing here needs to persist past this one investigation), so it's a
# plain Job instead.
#
# benchmark_w8a8_block_fp8.py (the tuner) is patched the same small, additive
# way as the local vllm/ clone (see benchmarks/kernels/benchmark_w8a8_block_
# fp8.py there) -- reproduced here as a literal text patch, asserted against so
# it fails loudly rather than silently no-op'ing if upstream's source has
# moved. It's otherwise run completely unmodified through its own CLI.
#
# There's no upstream tool that reports default-vs-tuned timing (confirmed:
# neither this script nor benchmark_block_fp8_gemm.py do -- the latter also
# turned out to be broken against this vllm version's kernel interface, a
# separate bug, unrelated to us), so the comparison step below is necessarily
# new code -- but it only calls the tuner's own benchmark_config() function
# twice per batch size (default config vs. tuned config), the same function
# the tuner itself uses to pick a winner. Nothing about kernel timing is
# reimplemented.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-27b-fp8-dense-pr-evidence
  namespace: enterprise-ai
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: present
      containers:
        - name: pr-evidence
          # Pinned exact release to cite in the PR. The benchmark script used
          # below is already baked into this image at /vllm-workspace/benchmarks/
          # (see vllm's Dockerfile, `COPY benchmarks benchmarks`), so there's
          # nothing to fetch from GitHub.
          image: docker.io/vllm/vllm-openai:v0.27.1
          env:
            # OpenShift assigns an arbitrary UID with no /etc/passwd entry, so
            # $HOME defaults to "/" -- some import paths try to
            # os.makedirs("$HOME/.cache/...") and fail with PermissionError
            # otherwise. Same fix our serving runtimes already use for HF_HOME.
            - name: HOME
              value: /tmp
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              echo "=== patching a throwaway copy of the tuner's shape function ==="
              python3 - <<'PATCH_EOF'
              # Qwen/Qwen3.8-27B-FP8, tensor_parallel_size=2, NVIDIA L40S dense W8A8
              # block-FP8 shapes: captured from the live qwen-27b-predictor pod's
              # "Using default..." warnings. Same edit as applied locally to the
              # vllm/ clone alongside this manifest, reproduced here so the Job
              # doesn't depend on copying files out of that clone.
              SHAPES = """    return [
                      (17408, 5120),
                      (8192, 5120),
                      (7168, 5120),
                      (5120, 8704),
                      (5120, 3072),
                  ]

              """

              tune_path = "/vllm-workspace/benchmarks/kernels/benchmark_w8a8_block_fp8.py"
              src = open(tune_path).read()
              anchor = (
                  "def get_weight_shapes(tp_size):\n"
                  "    # NOTE(HandH1998): The weight shapes only works for DeepSeek-V3.\n"
              )
              assert anchor in src, "get_weight_shapes() has moved upstream -- update this patch"
              src = src.replace(anchor, anchor.split("\n")[0] + "\n" + SHAPES + anchor.split("\n", 1)[1], 1)
              open("/tmp/tune_qwen27b.py", "w").write(src)
              PATCH_EOF

              echo "=== 1/2: tuning against vllm/vllm-openai:v0.27.1, via the tuner's own CLI ==="
              python3 /tmp/tune_qwen27b.py \
                --tp-size 2 --input-type fp8 --out-dtype bfloat16 \
                --block-n 128 --block-k 128 --save-path /tmp/tuned-configs
              ls -la /tmp/tuned-configs

              echo "=== writing the default-vs-tuned comparison script ==="
              cat > /tmp/compare.py <<'COMPARE_EOF'
              import importlib.util
              import json
              import sys

              import torch

              TUNE_SCRIPT = "/tmp/tune_qwen27b.py"

              # The exact hardcoded fallback vllm/model_executor/layers/quantization/
              # utils/fp8_utils.py's w8a8_triton_block_scaled_mm() uses when no tuned
              # config file is found for a shape -- i.e. what this model was silently
              # running on before any of this tuning work.
              DEFAULT_CONFIG = {
                  "BLOCK_SIZE_M": 64,
                  "BLOCK_SIZE_N": 128,
                  "BLOCK_SIZE_K": 128,
                  "GROUP_SIZE_M": 32,
                  "num_warps": 4,
                  "num_stages": 2,
              }
              BATCH_SIZES = [
                  1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 256,
                  512, 1024, 1536, 2048, 3072, 4096,
              ]
              SHAPES = [
                  (17408, 5120),
                  (8192, 5120),
                  (7168, 5120),
                  (5120, 8704),
                  (5120, 3072),
              ]
              BLOCK_N, BLOCK_K = 128, 128
              OUT_DTYPE_NAME = "bfloat16"
              TUNED_DIR = "/tmp/tuned-configs"
              NUM_ITERS = 50  # more than tune()'s internal 10, cheap since only ~180 calls total


              def load_module(path, name):
                  spec = importlib.util.spec_from_file_location(name, path)
                  mod = importlib.util.module_from_spec(spec)
                  sys.modules[name] = mod
                  spec.loader.exec_module(mod)
                  return mod


              def make_tensors(M, N, K, block_n, block_k):
                  # Mirrors benchmark_w8a8_block_fp8.py's own tune() tensor
                  # construction, so this exercises the identical inputs the tuner
                  # itself searched over.
                  fp8_info = torch.finfo(torch.float8_e4m3fn)
                  fp8_max, fp8_min = fp8_info.max, fp8_info.min
                  factor = 1e-2

                  A_fp32 = (torch.rand(M, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                  A = A_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
                  B_fp32 = (torch.rand(N, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
                  B = B_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)

                  n_tiles = (N + block_n - 1) // block_n
                  k_tiles = (K + block_k - 1) // block_k
                  As = torch.rand(M, k_tiles, dtype=torch.float32, device="cuda") * factor
                  Bs = torch.rand(n_tiles, k_tiles, dtype=torch.float32, device="cuda") * factor
                  return A, B, As, Bs


              def main():
                  mod = load_module(TUNE_SCRIPT, "tune_qwen27b")
                  device_name = mod.get_device_name_as_file_name()
                  out_dtype = mod.DTYPE_MAP[OUT_DTYPE_NAME]

                  for N, K in SHAPES:
                      json_path = (
                          f"{TUNED_DIR}/N={N},K={K},device_name={device_name},"
                          f"dtype=fp8_w8a8,block_shape=[{BLOCK_N},{BLOCK_K}].json"
                      )
                      with open(json_path) as f:
                          tuned_configs = {int(k): v for k, v in json.load(f).items()}

                      print(f"\n### N={N}, K={K}, device={device_name}")
                      print("| batch size (M) | default (us) | tuned (us) | speedup |")
                      print("|---:|---:|---:|---:|")
                      for M in BATCH_SIZES:
                          A, B, As, Bs = make_tensors(M, N, K, BLOCK_N, BLOCK_K)
                          default_us = mod.benchmark_config(
                              A, B, As, Bs, [BLOCK_N, BLOCK_K], DEFAULT_CONFIG, out_dtype,
                              num_iters=NUM_ITERS,
                          )
                          tuned_us = mod.benchmark_config(
                              A, B, As, Bs, [BLOCK_N, BLOCK_K], tuned_configs[M], out_dtype,
                              num_iters=NUM_ITERS,
                          )
                          speedup = (default_us - tuned_us) / default_us * 100
                          print(f"| {M} | {default_us:.2f} | {tuned_us:.2f} | {speedup:+.1f}% |")


              if __name__ == "__main__":
                  main()
              COMPARE_EOF

              echo "=== 2/2: comparing default vs. tuned config, per batch size ==="
              python3 /tmp/compare.py

              echo "=== done, sleeping so results can be copied out ==="
              sleep infinity
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 28Gi
              nvidia.com/gpu: "1"
