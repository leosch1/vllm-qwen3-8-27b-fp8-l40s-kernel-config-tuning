# Minimal throwaway pod, purely to get access to the nsys CLI so we can
# re-export additional tables (NVTX_EVENTS) from an ALREADY-CAPTURED local
# .nsys-rep -- no model load, no GPU traffic, no new capture needed. Carries
# the same nvidia-nsight-profile label + GPU request our profiling pods use,
# to test whether that alone triggers the nsys binary injection outside of
# a full InferenceService.
apiVersion: v1
kind: Pod
metadata:
  name: nsys-export-helper
  namespace: enterprise-ai
  labels:
    nvidia-nsight-profile: enabled
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  restartPolicy: Never
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Equal
      value: present
  containers:
    - name: nsys-export-helper
      image: docker.io/vllm/vllm-openai:v0.27.1
      command: ["/bin/bash", "-c", "sleep 3600"]
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
