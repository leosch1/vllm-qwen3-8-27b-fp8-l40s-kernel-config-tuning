# Graph-enabled (no --enforce-eager, matching 20/21/22's real-serving
# captures -- NOT 02's diagnostic --enforce-eager pass, which would
# disable graph capture entirely and defeat this experiment's purpose).
# Plain default kernel config (no tuned-configs mount) -- the
# replay-vs-eager question this experiment answers is config-independent.
# Only addition: the instrumented cudagraph_dispatcher.py overlay.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-qwen3-8-27b-fp8-pr-evidence-gpu
  namespace: enterprise-ai
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/template-display-name: vLLM Runtime for Qwen3.8-27B-FP8 (PR evidence, GPU)
    openshift.io/display-name: vLLM Qwen3.8-27B-FP8 PR Evidence GPU
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
  - name: kserve-container
    image: docker.io/vllm/vllm-openai:v0.27.1
    command:
    - python3
    - -m
    - vllm.entrypoints.openai.api_server
    args:
    - --port=8080
    - --model=/mnt/models
    - --served-model-name={{.Name}}
    - --tensor-parallel-size=2
    - --max-model-len=8192
    - --reasoning-parser=qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --max-num-seqs=128
    # --enforce-eager INTENTIONALLY OMITTED -- graphs must stay on so we can
    # observe real replay-vs-eager dispatch behavior.
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
    - name: HOME
      value: /tmp
    ports:
    - containerPort: 8080
      protocol: TCP
    volumeMounts:
    - mountPath: /dev/shm
      name: shm
    - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/cudagraph_dispatcher.py
      name: cudagraph-dispatcher-instrumented
      subPath: cudagraph_dispatcher.py
      readOnly: true
  multiModel: false
  volumes:
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
  - name: cudagraph-dispatcher-instrumented
    configMap:
      name: cudagraph-dispatcher-instrumented
  supportedModelFormats:
  - autoSelect: true
    name: vLLM
