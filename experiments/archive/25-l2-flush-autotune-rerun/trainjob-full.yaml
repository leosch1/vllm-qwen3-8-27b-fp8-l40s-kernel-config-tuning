apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: qwen3-8-27b-l2-flush-retune-full
  namespace: enterprise-ai
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
spec:
  runtimeRef:
    name: torch-distributed-cuda130-torch210-py312
  labels:
    kueue.x-k8s.io/queue-name: gpu-autotune
  trainer:
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0-1786533823
    numNodes: 1
    numProcPerNode: 1
    resourcesPerNode:
      requests:
        cpu: "2"
        memory: 16Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "6"
        memory: 28Gi
        nvidia.com/gpu: "1"
    command:
      - /bin/bash
      - -lc
    args:
      - |
        set -euo pipefail

        cat > /tmp/benchmark_w8a8_block_fp8.py <<'BENCHMARK_SCRIPT_EOF'
        # SPDX-License-Identifier: Apache-2.0
        # SPDX-FileCopyrightText: Copyright contributors to the vLLM project
        # Adapted from sglang quantization/tuning_block_wise_kernel.py
        #
        # Experiment 24 (full rerun): this is the REAL production autotune
        # script, byte-identical to enterprise-ai/manifests/autotune/
        # qwen3-8-27b-fp8-dense-trainjob.yaml's embedded copy, with exactly
        # ONE function changed: tune()'s weight-tensor handling. Search for
        # "EXP24 CHANGE" below for the only diff from the real script. This
        # generalizes 17's 64-copy-cycling fix: instead of cycling through a
        # model-specific number of weight copies, flush L2 directly (sized
        # from the actual device's reported L2 capacity) before every timed
        # launch -- no per-model tuning constant needed at all.

        import argparse
        import json
        import multiprocessing as mp
        import os
        import re
        import time
        from datetime import datetime
        from functools import cache
        from typing import Any

        import torch
        from tqdm import tqdm

        from vllm.model_executor.layers.quantization.utils.fp8_utils import (
            _w8a8_triton_block_scaled_mm,
        )
        from vllm.platforms import current_platform
        from vllm.triton_utils import triton
        from vllm.utils.argparse_utils import FlexibleArgumentParser


        @cache
        def get_device_name_as_file_name(device_id: int = 0) -> str:
            name = current_platform.get_device_name(device_id)
            name = re.sub(r"[\s/]+", "_", name)
            return name


        mp.set_start_method("spawn", force=True)

        assert current_platform.is_cuda() or current_platform.is_rocm(), (
            "Only support tune w8a8 block fp8 kernel on CUDA/ROCm device."
        )

        DTYPE_MAP = {
            "float32": torch.float32,
            "float16": torch.float16,
            "half": torch.half,
            "bfloat16": torch.bfloat16,
        }


        def w8a8_block_matmul(
            A: torch.Tensor,
            B: torch.Tensor,
            As: torch.Tensor,
            Bs: torch.Tensor,
            block_size: list[int],
            config: dict[str, Any],
            output_dtype: torch.dtype = torch.float16,
        ) -> torch.Tensor:
            assert len(block_size) == 2
            block_n, block_k = block_size[0], block_size[1]

            assert A.shape[-1] == B.shape[-1]
            assert A.shape[:-1] == As.shape[:-1] and A.is_contiguous()
            assert triton.cdiv(A.shape[-1], block_k) == As.shape[-1]
            M = A.numel() // A.shape[-1]

            assert B.ndim == 2 and B.is_contiguous() and Bs.ndim == 2
            N, K = B.shape
            assert triton.cdiv(N, block_n) == Bs.shape[0]
            assert triton.cdiv(K, block_k) == Bs.shape[1]

            C_shape = A.shape[:-1] + (N,)
            C = A.new_empty(C_shape, dtype=output_dtype)

            def grid(META):
                return (
                    triton.cdiv(M, META["BLOCK_SIZE_M"]) * triton.cdiv(N, META["BLOCK_SIZE_N"]),
                )

            if A.dtype == torch.float8_e4m3fn:
                kernel = _w8a8_triton_block_scaled_mm
            else:
                raise RuntimeError("Currently, only support tune w8a8 block fp8 kernel.")

            kernel[grid](
                A, B, C, As, Bs, M, N, K, block_n, block_k,
                A.stride(-2), A.stride(-1),
                B.stride(1), B.stride(0),
                C.stride(-2), C.stride(-1),
                As.stride(-2), As.stride(-1),
                Bs.stride(1), Bs.stride(0),
                **config,
            )
            return C


        def get_configs_compute_bound():
            configs = []
            for num_stages in [2, 3, 4, 5]:
                for block_m in [16, 32, 64, 128, 256]:
                    for block_k in [64, 128]:
                        for block_n in [32, 64, 128, 256]:
                            for num_warps in [4, 8]:
                                for group_size in [1, 16, 32, 64]:
                                    configs.append(
                                        {
                                            "BLOCK_SIZE_M": block_m,
                                            "BLOCK_SIZE_N": block_n,
                                            "BLOCK_SIZE_K": block_k,
                                            "GROUP_SIZE_M": group_size,
                                            "num_warps": num_warps,
                                            "num_stages": num_stages,
                                        }
                                    )
            return configs


        def get_weight_shapes(tp_size):
            # overridden by driver.py below for the real qwen-27b shapes
            raise NotImplementedError


        def benchmark_config(
            A, B, As, Bs, block_size, config, out_dtype=torch.float16, num_iters=10
        ):
            def run():
                w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

            torch.accelerator.synchronize()
            for _ in range(5):
                run()
            torch.accelerator.synchronize()

            start_event = torch.Event(enable_timing=True)
            end_event = torch.Event(enable_timing=True)

            latencies: list[float] = []
            for i in range(num_iters):
                torch.accelerator.synchronize()
                start_event.record()
                run()
                end_event.record()
                end_event.synchronize()
                latencies.append(start_event.elapsed_time(end_event))
            avg = sum(latencies) / (num_iters * 10) * 1000  # us
            return avg


        # ============================================================
        # EXP24 CHANGE: L2-flush buffer sized from the device's actual
        # reported L2 capacity, and a flush-aware benchmark_config used only
        # inside tune() below. Everything else in this file is the real
        # script, unmodified.
        # ============================================================
        # Generous, documented fallback if this PyTorch build doesn't expose
        # L2_cache_size -- comfortably exceeds every current data-center GPU's
        # L2 (H100/H200 ~50MB, L40S ~96MB, B200 ~126MB known as of writing).
        FALLBACK_L2_BYTES = 128 * 1024 * 1024


        def resolve_l2_bytes():
            device = torch.cuda.current_device()
            try:
                l2 = torch.cuda.get_device_properties(device).L2_cache_size
                if l2 and l2 > 0:
                    print(f"resolved L2_cache_size from device properties: {l2/1e6:.1f}MB",
                          flush=True)
                    return l2
            except AttributeError:
                pass
            print(f"WARNING: L2_cache_size not exposed by this PyTorch build, "
                  f"falling back to {FALLBACK_L2_BYTES/1e6:.0f}MB", flush=True)
            return FALLBACK_L2_BYTES


        _L2_BYTES = resolve_l2_bytes()
        _FLUSH_BUF = torch.empty(int(_L2_BYTES * 1.5) // 4, dtype=torch.int32, device="cuda")


        def benchmark_config_flush(A, B, As, Bs, block_size, config, out_dtype, num_iters=10):
            def run():
                w8a8_block_matmul(A, B, As, Bs, block_size, config, out_dtype)

            torch.accelerator.synchronize()
            for _ in range(5):
                run()  # warmup: JIT compile only, doesn't need a cold cache
            torch.accelerator.synchronize()

            start_event = torch.Event(enable_timing=True)
            end_event = torch.Event(enable_timing=True)
            latencies: list[float] = []
            for _ in range(num_iters):
                _FLUSH_BUF.zero_()  # force eviction of A/B/C from L2 before this launch
                torch.accelerator.synchronize()
                start_event.record()
                run()
                end_event.record()
                end_event.synchronize()
                latencies.append(start_event.elapsed_time(end_event))
            avg = sum(latencies) / (num_iters * 10) * 1000  # us
            return avg


        def tune(M, N, K, block_size, out_dtype, search_space, input_type):
            factor_for_scale = 1e-2

            if input_type != "fp8":
                raise RuntimeError("Currently, only support tune w8a8 block fp8 kernel.")

            fp8_info = torch.finfo(torch.float8_e4m3fn)
            fp8_max, fp8_min = fp8_info.max, fp8_info.min

            A_fp32 = (
                (torch.rand(M, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
            )
            A = A_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)

            block_n, block_k = block_size[0], block_size[1]
            n_tiles = (N + block_n - 1) // block_n
            k_tiles = (K + block_k - 1) // block_k

            As = torch.rand(M, k_tiles, dtype=torch.float32, device="cuda") * factor_for_scale

            # EXP24 CHANGE: instead of ONE fixed B/Bs pair reused across all
            # 1280 candidates (the confirmed blind spot -- 14/16), OR 17's
            # 64-copy cycling pool, allocate a single B/Bs pair and flush L2
            # directly before every timed launch. No per-model constant.
            B_fp32 = (
                (torch.rand(N, K, dtype=torch.float32, device="cuda") - 0.5) * 2 * fp8_max
            )
            B = B_fp32.clamp(min=fp8_min, max=fp8_max).to(torch.float8_e4m3fn)
            Bs = (
                torch.rand(n_tiles, k_tiles, dtype=torch.float32, device="cuda")
                * factor_for_scale
            )
            torch.accelerator.synchronize()

            best_config = None
            best_time = float("inf")
            for config in tqdm(search_space):
                try:
                    kernel_time = benchmark_config_flush(
                        A,
                        B,
                        As,
                        Bs,
                        block_size,
                        config,
                        out_dtype,
                        num_iters=10,
                    )
                except triton.runtime.autotuner.OutOfResources:
                    continue

                if kernel_time < best_time:
                    best_time = kernel_time
                    best_config = config
            now = datetime.now()
            print(f"{now.ctime()}] Completed tuning for batch_size={M} "
                  f"(L2-flush, single A/B pair)")
            assert best_config is not None
            return best_config
        # ============================================================
        # END EXP24 CHANGE -- everything below is the real script, unmodified.
        # ============================================================


        def save_configs(
            N,
            K,
            block_n,
            block_k,
            configs,
            save_path,
            input_type="fp8",
        ) -> None:
            os.makedirs(save_path, exist_ok=True)
            device_name = get_device_name_as_file_name()
            json_file_name = (
                f"N={N},K={K},device_name={device_name},dtype={input_type}_w8a8,"
                f"block_shape=[{block_n},{block_k}].json"
            )

            config_file_path = os.path.join(save_path, json_file_name)
            print(f"Writing best config to {config_file_path}...")

            with open(config_file_path, "w") as f:
                json.dump(configs, f, indent=4)
                f.write("\n")

            # EXP24 addition: also dump to stdout so results are captured even
            # if the pod is cleaned up before `oc cp` can run.
            print(f"=== CONFIG_JSON_BEGIN {json_file_name} ===")
            print(json.dumps(configs, indent=2))
            print(f"=== CONFIG_JSON_END {json_file_name} ===")


        def tune_on_gpu(args_dict):
            gpu_id = args_dict["gpu_id"]
            batch_sizes = args_dict["batch_sizes"]
            weight_shapes = args_dict["weight_shapes"]
            args = args_dict["args"]

            torch.accelerator.set_device_index(gpu_id)
            print(f"Starting tuning on GPU {gpu_id} with batch sizes {batch_sizes}")

            block_n = args.block_n
            block_k = args.block_k
            out_dtype = DTYPE_MAP[args.out_dtype]
            save_path = args.save_path
            input_type = args.input_type

            search_space = get_configs_compute_bound()
            search_space = [
                config for config in search_space if block_k % config["BLOCK_SIZE_K"] == 0
            ]

            start = time.time()
            for shape in tqdm(weight_shapes, desc=f"GPU {gpu_id} - Shapes"):
                N, K = shape[0], shape[1]
                print(f"[GPU {gpu_id}] Tune for weight shape of `N: {N}, K: {K}`")
                benchmark_results = [
                    tune(
                        batch_size,
                        N,
                        K,
                        [block_n, block_k],
                        out_dtype,
                        search_space,
                        input_type,
                    )
                    for batch_size in tqdm(batch_sizes, desc=f"GPU {gpu_id} - Batch sizes")
                ]
                best_configs = {M: config for M, config in zip(batch_sizes, benchmark_results)}
                save_configs(N, K, block_n, block_k, best_configs, save_path, input_type)

            end = time.time()
            print(f"Tuning on GPU {gpu_id} took {end - start:.2f} seconds")


        def distribute_batch_sizes(batch_sizes, num_gpus):
            batches_per_gpu = []
            for i in range(num_gpus):
                start_idx = i * len(batch_sizes) // num_gpus
                end_idx = (i + 1) * len(batch_sizes) // num_gpus
                batches_per_gpu.append(batch_sizes[start_idx:end_idx])
            return batches_per_gpu


        def main(args):
            print(args)
            num_gpus = torch.accelerator.device_count()
            if num_gpus == 0:
                raise RuntimeError("No GPU available for tuning")
            print(f"Found {num_gpus} GPUs for parallel tuning")

            torch.cuda.init()

            if args.batch_size is None:
                batch_sizes = [
                    1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 256, 512,
                    1024, 1536, 2048, 3072, 4096,
                ]
            else:
                batch_sizes = [args.batch_size]
                num_gpus = 1

            weight_shapes = get_weight_shapes(args.tp_size)
            batches_per_gpu = distribute_batch_sizes(batch_sizes, num_gpus)

            process_args = []
            for gpu_id in range(num_gpus):
                process_args.append(
                    {
                        "gpu_id": gpu_id,
                        "batch_sizes": batches_per_gpu[gpu_id],
                        "weight_shapes": weight_shapes,
                        "args": args,
                    }
                )

            ctx = mp.get_context("spawn")
            with ctx.Pool(num_gpus) as pool:
                pool.map(tune_on_gpu, process_args)

            print("Multi-GPU tuning completed")


        if __name__ == "__main__":
            parser = FlexibleArgumentParser(description="L2-flush w8a8 retune (exp24)")
            parser.add_argument("--tp-size", "-tp", type=int, default=8)
            parser.add_argument("--input-type", type=str, choices=["fp8"], default="fp8")
            parser.add_argument(
                "--out-dtype",
                type=str,
                choices=["float32", "float16", "bfloat16", "half"],
                default="float16",
            )
            parser.add_argument("--block-n", type=int, default=128)
            parser.add_argument("--block-k", type=int, default=128)
            parser.add_argument("--batch-size", type=int, required=False)
            parser.add_argument("--save-path", type=str, default="./")
            args = parser.parse_args()

            main(args)
        BENCHMARK_SCRIPT_EOF

        cat > /tmp/driver.py <<'DRIVER_SCRIPT_EOF'
        import argparse
        import importlib.util
        import sys


        def _load_benchmark_module():
            spec = importlib.util.spec_from_file_location(
                "benchmark_w8a8_block_fp8", "/tmp/benchmark_w8a8_block_fp8.py"
            )
            mod = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = mod
            spec.loader.exec_module(mod)
            return mod


        if __name__ == "__main__":
            mod = _load_benchmark_module()

            # Same real qwen-27b dense W8A8 block-FP8 shapes as the production
            # autotune job (captured from the live predictor's startup warnings).
            QWEN27B_DENSE_SHAPES = [
                (17408, 5120),  # gate_up_proj
                (8192, 5120),   # in_proj_qkvz
                (7168, 5120),   # qkv_proj
                (5120, 8704),   # down_proj
                (5120, 3072),   # out_proj
            ]
            mod.get_weight_shapes = lambda tp_size: QWEN27B_DENSE_SHAPES

            args = argparse.Namespace(
                tp_size=2,
                input_type="fp8",
                out_dtype="bfloat16",
                block_n=128,
                block_k=128,
                batch_size=None,
                save_path="/tmp/l2-flush-tuned-configs",
            )
            mod.main(args)
        DRIVER_SCRIPT_EOF

        python3 /tmp/driver.py

        echo "=== final file listing ==="
        ls -la /tmp/l2-flush-tuned-configs
