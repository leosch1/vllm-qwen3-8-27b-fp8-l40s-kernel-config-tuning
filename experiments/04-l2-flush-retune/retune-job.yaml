# Full production-scope (5 shapes x 18 M) autotuning rerun with the L2-flush
# fix applied -- this is what actually produced the repo's committed
# tuned-configs/. Expect ~2+ hours: the original, unpatched full run took
# ~133 minutes: flushing L2 before every one of the 10 timed iterations
# per candidate adds real time on top of that.
#
# Usage:
#   kubectl apply -f retune-job.yaml
#   kubectl logs -f job/qwen3-8-27b-fp8-l2-flush-retune
#   kubectl cp <pod>:/repo/l2-flush-tuned-configs ./l2-flush-tuned-configs
#   kubectl delete -f retune-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-27b-fp8-l2-flush-retune
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: present
      initContainers:
        - name: clone-repo
          image: docker.io/alpine/git:latest
          args:
            - clone
            - --depth=1
            - https://github.com/leosch1/vllm-qwen3-8-27b-fp8-l40s-kernel-config-tuning.git
            - /repo
          volumeMounts:
            - mountPath: /repo
              name: repo
      containers:
        - name: retune
          image: docker.io/vllm/vllm-openai:v0.27.1
          workingDir: /repo
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              cp experiments/04-l2-flush-retune/benchmark_w8a8_block_fp8_l2flush.py .
              python3 benchmark_w8a8_block_fp8_l2flush.py \
                --tp-size 2 --input-type fp8 --out-dtype bfloat16 \
                --block-n 128 --block-k 128 \
                --save-path /repo/l2-flush-tuned-configs
              echo "=== done, sleeping so results can be copied out ==="
              sleep infinity
          volumeMounts:
            - mountPath: /repo
              name: repo
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 28Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: repo
          emptyDir: {}
